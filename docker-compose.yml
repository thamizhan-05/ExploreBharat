version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: explorebharat-postgres
    restart: always
    environment:
      POSTGRES_USER: explorebharat
      POSTGRES_PASSWORD: explorebharat_secure_password_2026
      POSTGRES_DB: explorebharat_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U explorebharat -d explorebharat_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: explorebharat-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: explorebharat-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://explorebharat:explorebharat_secure_password_2026@postgres:5432/explorebharat_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: production_jwt_secret_explore_bharat_super_key_2026
      JWT_REFRESH_SECRET: production_jwt_refresh_explore_bharat_key_2026
      FRONTEND_URL: http://localhost:3000
      SEED_ON_STARTUP: "true"
      DEMO_MODE: "false"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: explorebharat-web
    restart: always
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api

volumes:
  postgres_data:
  redis_data:
