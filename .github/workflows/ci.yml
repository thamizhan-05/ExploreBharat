name: BharatYatra CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Build, Typecheck & Integration Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared types
        run: npm run build --workspace=@bharatyatra/types

      - name: Generate Prisma client & Push Schema
        run: |
          cd packages/database
          npx prisma generate
          npx prisma db push --skip-generate
          npm run seed

      - name: Typecheck Backend API
        run: |
          cd apps/api
          npx tsc --noEmit

      - name: Run Backend Integration & Security Tests
        run: |
          cd apps/api
          npm test

      - name: Build Web Application (Next.js)
        run: |
          cd apps/web
          npm run build

      - name: Typecheck Mobile Client (Expo React Native)
        run: |
          cd apps/mobile
          npx tsc --noEmit
