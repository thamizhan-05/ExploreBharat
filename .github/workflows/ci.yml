name: ExploreBharat CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Build, Typecheck & Integration Test
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: "file:./dev.db"
      JWT_SECRET: "ci-test-jwt-secret-key-explorebharat-2026"
      JWT_REFRESH_SECRET: "ci-test-refresh-jwt-secret-key-explorebharat-2026"
      PAYMENT_PROVIDER_MODE: "demo"
      MAPS_PROVIDER: "leaflet_osm"
      AI_PROVIDER: "internal_engine"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build shared types
        run: npm run build --workspace=@bharatyatra/types

      - name: Setup Database & Seed Test Data
        run: |
          cd packages/database
          npx prisma generate
          npx prisma db push --skip-generate
          npm run seed
          npm run build

      - name: Build Backend API
        run: npm run build --workspace=@bharatyatra/api

      - name: Run Backend Integration & Security Tests (66 Test Suites)
        run: npm test --workspace=@bharatyatra/api

      - name: Build Web Application (Next.js)
        run: npm run build --workspace=@bharatyatra/web

      - name: Typecheck Mobile Client (Expo React Native)
        run: |
          cd apps/mobile
          npx tsc --noEmit
