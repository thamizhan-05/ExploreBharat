<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded App Icon Background for standalone icon -->
  <rect width="64" height="64" rx="14" fill="#132238"/>
  
  <!-- Pin Mark scaled and centered -->
  <g transform="translate(14, 8) scale(0.45)">
    <!-- Main Pin Body (White in icon/dark context) -->
    <path d="M 40 102 C 38 97 8 62 8 40 C 8 22.3 22.3 8 40 8 C 42 8 44 8.2 46 8.6 L 46 17 C 44 16.7 42 16.5 40 16.5 C 27 16.5 16.5 27 16.5 40 C 16.5 56.5 38 86 40 91 C 42 86 63.5 56.5 63.5 40 C 63.5 38 63.3 36 63 34 L 71.4 34 C 71.8 36 72 38 72 40 C 72 62 42 97 40 102 Z" fill="#FFFFFF"/>
    
    <!-- Top-Right Vibrant Orange Arc -->
    <path d="M 49 8.8 C 61.8 11.8 71.8 21.8 74.8 34.6 L 66.5 36.5 C 64.2 26.8 56.8 19.4 47.1 17.1 Z" fill="#F58220"/>
    
    <!-- Inner Compass Dial White Disk / Cutout -->
    <circle cx="40" cy="40" r="23.5" fill="#132238" stroke="#FFFFFF" stroke-width="2.5"/>
    
    <!-- Compass Crosshairs -->
    <line x1="40" y1="13.5" x2="40" y2="19.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="40" y1="60.5" x2="40" y2="66.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="13.5" y1="40" x2="19.5" y2="40" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="60.5" y1="40" x2="66.5" y2="40" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- S-curved winding road / river -->
    <path d="M 38 63.5 C 38 56 46 54 44 47 C 42 41 33 40 37 32" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>
    
    <!-- Compass Needle / Arrow pointing North-East -->
    <polygon points="40,37 54,26 43,40" fill="#F58220"/>
    <polygon points="40,37 43,40 37,42" fill="#FFFFFF"/>
  </g>
</svg>
